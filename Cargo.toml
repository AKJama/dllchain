[workspace]
members = ["crates/chainkit", "crates/dllchain"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/AKJama/dllchain"
publish = false

[workspace.dependencies]
sha2 = "0.11"
zip = { version = "9.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
windows-sys = "0.61"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
